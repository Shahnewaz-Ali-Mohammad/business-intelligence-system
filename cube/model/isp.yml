  # Union financial streams before aggregation; joining raw fact tables
  # to each other would multiply transactions and inflate amounts.
  - name: IspFinancial
    sql: >
      SELECT f.*, dc.pop_id,
        CASE WHEN f.kind IN ('refund', 'adjustment') THEN dc.package_id
             ELSE f.transaction_package_id END AS package_id
      FROM (
        SELECT 'billing:' || billing_sk AS record_key, 'billing' AS kind,
          customer_id, ref_date, package_id AS transaction_package_id,
          amount AS billed, 0::numeric AS collected, 0::numeric AS refunded, 0::numeric AS adjusted
        FROM fact_billing
        UNION ALL
        SELECT 'collection:' || collection_sk, 'collection', customer_id, ref_date, package_id,
          0::numeric, amount, 0::numeric, 0::numeric FROM fact_collection
        UNION ALL
        SELECT 'refund:' || refund_sk, 'refund', customer_id, ref_date, NULL::text,
          0::numeric, 0::numeric, amount, 0::numeric FROM fact_refund
        UNION ALL
        SELECT 'adjustment:' || adjustment_sk, 'adjustment', customer_id, ref_date, NULL::text,
          0::numeric, 0::numeric, 0::numeric, amount FROM fact_adjustment
      ) f LEFT JOIN dim_customer dc ON f.customer_id = dc.customer_id
    meta:
      source_tables: [fact_billing, fact_collection, fact_refund, fact_adjustment, dim_customer]
    joins:
      - name: IspCustomer
        sql: "{CUBE}.customer_id = {IspCustomer}.customer_id"
        relationship: many_to_one
      - name: IspPop
        sql: "{CUBE}.pop_id = {IspPop}.pop_id"
        relationship: many_to_one
      - name: IspPackage
        sql: "{CUBE}.package_id = {IspPackage}.package_id"
        relationship: many_to_one
    measures:
      - name: total_billed
        sql: billed
        type: sum
      - name: total_collected
        sql: collected
        type: sum
      - name: total_refunded
        sql: refunded
        type: sum
      - name: total_adjusted
        sql: adjusted
        type: sum
      - name: outstanding
        sql: billed - collected
        type: sum
      - name: collection_rate
        sql: "100.0 * {total_collected} / NULLIF({total_billed}, 0)"
        type: number
    dimensions:
      - name: record_key
        sql: record_key
        type: string
        primary_key: true
        public: true
      - name: kind
        sql: kind
        type: string
      - name: customer_id
        sql: customer_id
        type: string
      - name: pop_id
        sql: pop_id
        type: string
      - name: package_id
        sql: package_id
        type: string
      - name: ref_date
        sql: ref_date
        type: time
