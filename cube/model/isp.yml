        sql: amount
        type: sum
      - name: adjustment_count
        sql: adjustment_sk
        type: count
      - name: avg_transaction_amount
        sql: amount
        type: avg
      - name: min_transaction_amount
        sql: amount
        type: min
      - name: max_transaction_amount
        sql: amount
        type: max
    dimensions:
      - name: adjustment_sk
        sql: adjustment_sk
        type: number
        primary_key: true
        public: true
      - name: source_synced_at
        sql: source_synced_at
        type: time
      - name: source_snid
        sql: source_snid
        type: string
      - name: amount
        sql: amount
        type: number
      - name: ref_date
        sql: ref_date
        type: time
      - name: customer_id
        sql: customer_id
        type: string

  # Tickets: CORRECTION 2026-10-01 -- the comment this replaced was stale.
  # src/etl/tables/tickets.mjs IS already wired to the real, confirmed
  # source table (TicketingDB.dbo.Tk_TicketInfoMaster) -- ticket_count,
  # customer_id, department_id (from GroupID), ticket_type_id, opened_date,
  # and status are all real, populated data, not placeholders.
  # The one genuine gap: resolved_date is deliberately left NULL. No
  # confirmed "ticket resolved" column exists on the source table --
  # StatusChangeDate is the closest candidate but has not been verified to
  # actually mean "resolved" (it could reflect any status change). Per
  # this project's "no assumptions" rule it is left unmapped rather than
  # guessed, so avg_resolution_hours will be null for every row until that
  # column is independently verified against real data.
  - name: IspTicket
    # Source SNID is unique and maps to fact_ticket.source_ticket_id.
    # Keep the fact grain while exposing ticket details omitted by its ETL.
    sql: |
      SELECT f.*,
          r."TicketNo" AS ticket_no,
          r."TicketSourceID"::text AS ticket_source_id,
          r."CustomerName" AS customer_name,
          r."CustMobileNo" AS customer_mobile,
          r."CustEmail" AS customer_email,
          r."PopId"::text AS pop_id,
          r."POPName" AS pop_name,
          r."Subject" AS subject,
          r."Priority" AS priority,
          r."TicketStatusID"::text AS ticket_status_id,
          r."Message" AS message,
          r."FileName" AS file_name,
          r."AssignedTo"::text AS assigned_to,
          r."AssignedBy"::text AS assigned_by,
          r."TeamID"::text AS team_id,
          r."ForwardMessage" AS forward_message,
          r."AddedBy"::text AS added_by,
          r."UpdatedBy"::text AS updated_by,
          r."DateUpdated" AS date_updated,
          r."isCorporate" AS is_corporate,
          r."UpdatedDate" AS updated_date,
          r."DownCauseID"::text AS down_cause_id,
          r."IsForwarded" AS is_forwarded,
          r."TicketIndentityID"::text AS ticket_identity_id,
          r."ForwardedBy"::text AS forwarded_by,
          r."ForwardedTeam"::text AS forwarded_team,
          r."ForwardedTime" AS forwarded_time,
          r."StatusChangeDate" AS status_change_date,
          r."LastActivity" AS last_activity,
          r."LastActivityBy"::text AS last_activity_by,
          r."LastTicketNotes" AS last_ticket_notes,
          r."CallerCellNo" AS caller_cell_no,
          r."tkRefId"::text AS ticket_reference_id,
          r."FollowUpTime" AS follow_up_time,
          r."ETRTime" AS etr_time,
          r."LongTimeReasonID"::text AS long_time_reason_id,
          r."LinkId"::text AS link_id,
          r."Address" AS address,
          r."IsFeedbackDone" AS is_feedback_done,
          r."FeedbackEntry" AS feedback_entry,
          r."IsReOpen" AS is_reopen
      FROM public.fact_ticket f
      LEFT JOIN raw_ticketing."Tk_TicketInfoMaster" r ON r."SNID" = f.source_ticket_id
    meta:
      table: fact_ticket
      source_tables: [fact_ticket, raw_ticketing.Tk_TicketInfoMaster]
    joins:
      - name: IspCustomer
        sql: "{CUBE}.customer_id = {IspCustomer}.customer_id"
        relationship: many_to_one
      - name: IspDepartment
        sql: "{CUBE}.department_id = {IspDepartment}.department_id"
        relationship: many_to_one
      - name: IspTicketType
        sql: "{CUBE}.ticket_type_id = {IspTicketType}.ticket_type_id"
        relationship: many_to_one
    measures:
      - name: ticket_count
        sql: ticket_sk
        type: count
      - name: avg_resolution_hours
        sql: "EXTRACT(EPOCH FROM (resolved_date - opened_date)) / 3600.0"
        type: avg
    dimensions:
      - name: ticket_sk
        sql: ticket_sk
        type: number
        primary_key: true
        public: true
      - name: source_ticket_id
        sql: source_ticket_id
        type: string
      - name: source_synced_at
        sql: source_synced_at
        type: time
      - name: opened_date
        sql: opened_date
        type: time
      - name: resolved_date
        sql: resolved_date
        type: time
      - name: status
        sql: status
        type: string
      - name: customer_id
        sql: customer_id
        type: string
      - name: department_id
        sql: department_id
        type: string
      - name: ticket_type_id
        sql: ticket_type_id
        type: string

      - name: ticket_no
        sql: ticket_no
        type: string
      - name: ticket_source_id
        sql: ticket_source_id
        type: string
      - name: customer_name
        sql: customer_name
        type: string
      - name: customer_mobile
        sql: customer_mobile
        type: string
      - name: customer_email
        sql: customer_email
        type: string
      - name: pop_id
        sql: pop_id
        type: string
      - name: pop_name
        sql: pop_name
        type: string
      - name: subject
        sql: subject
        type: string
      - name: priority
        sql: priority
        type: string
      - name: ticket_status_id
        sql: ticket_status_id
        type: string
      - name: message
        sql: message
        type: string
      - name: file_name
        sql: file_name
        type: string
      - name: assigned_to
        sql: assigned_to
        type: string
      - name: assigned_by
        sql: assigned_by
        type: string
      - name: team_id
        sql: team_id
        type: string
      - name: forward_message
        sql: forward_message
        type: string
      - name: added_by
        sql: added_by
        type: string
      - name: updated_by
        sql: updated_by
        type: string
      - name: date_updated
        sql: date_updated
        type: time
      - name: is_corporate
        sql: is_corporate
        type: boolean
      - name: updated_date
        sql: updated_date
        type: time
      - name: down_cause_id
        sql: down_cause_id
        type: string
      - name: is_forwarded
        sql: is_forwarded
        type: boolean
      - name: ticket_identity_id
        sql: ticket_identity_id
        type: string
      - name: forwarded_by
        sql: forwarded_by
        type: string
      - name: forwarded_team
        sql: forwarded_team
        type: string
      - name: forwarded_time
        sql: forwarded_time
        type: time
      - name: status_change_date
        sql: status_change_date
        type: time
      - name: last_activity
        sql: last_activity
        type: time
      - name: last_activity_by
        sql: last_activity_by
        type: string
      - name: last_ticket_notes
        sql: last_ticket_notes
        type: string
      - name: caller_cell_no
        sql: caller_cell_no
        type: string
      - name: ticket_reference_id
        sql: ticket_reference_id
        type: string
      - name: follow_up_time
        sql: follow_up_time
        type: time
      - name: etr_time
        sql: etr_time
        type: time
      - name: long_time_reason_id
        sql: long_time_reason_id
        type: string
      - name: link_id
        sql: link_id
