cubes:
  - name: Customer
    sql_table: dim_customer
    measures:
      - name: customer_count
        sql: customer_id
        type: count
        # confidence: high -- Count of unique customers based on customer_id.
      - name: activated_count
        sql: activated_date
        type: count
        # confidence: high -- Count of customers who have activated their service.
      - name: entry_count
        sql: entry_date
        type: count
        # confidence: high -- Count of customers who have an entry date.
    dimensions:
      - name: customer_id
        sql: customer_id
        type: string
        # confidence: high -- Primary key for customer identification.
      - name: customer_name
        sql: customer_name
        type: string
        # confidence: high -- Name of the customer.
      - name: pop_id
        sql: pop_id
        type: string
        # confidence: medium -- Refers to the point of presence, but its business meaning is not clear.
      - name: package_id
        sql: package_id
        type: string
        # confidence: medium -- Refers to the package associated with the customer, but its business meaning is not clear.
      - name: status_id
        sql: status_id
        type: string
        # confidence: medium -- Refers to the status of the customer, but its business meaning is not clear.
      - name: connection_type
        sql: connection_type
        type: string
        # confidence: medium -- Type of connection, but its business meaning is not clear.
      - name: resident_type
        sql: resident_type
        type: string
        # confidence: medium -- Type of residency, but its business meaning is not clear.
      - name: entry_date
        sql: entry_date
        type: time
        # confidence: high -- Date when the customer entered the system.
      - name: activated_date
        sql: activated_date
        type: time
        # confidence: high -- Date when the customer activated their service.
      - name: source_synced_at
        sql: source_synced_at
        type: time
        # confidence: high -- Timestamp for when the data was last synced.
  - name: Date
    sql_table: dim_date
    measures:
    dimensions:
      - name: date_key
        sql: date_key
        type: time
        # confidence: high -- Primary key for date dimension.
      - name: year
        sql: year
        type: number
        # confidence: high -- Year part of the date.
      - name: quarter
        sql: quarter
        type: number
        # confidence: high -- Quarter part of the date.
      - name: month
        sql: month
        type: number
        # confidence: high -- Month part of the date.
      - name: month_name
        sql: month_name
        type: string
        # confidence: high -- Name of the month.
      - name: day
        sql: day
        type: number
        # confidence: high -- Day part of the date.
      - name: day_of_week
        sql: day_of_week
        type: number
        # confidence: high -- Day of the week.
      - name: week_of_year
        sql: week_of_year
        type: number
        # confidence: high -- Week number of the year.
  - name: Department
    sql_table: dim_department
    measures:
    dimensions:
      - name: department_id
        sql: department_id
        type: string
        # confidence: high -- Primary key for department.
      - name: department_name
        sql: department_name
        type: string
        # confidence: medium -- Name of the department, but its business meaning is not clear.
      - name: source_synced_at
        sql: source_synced_at
        type: time
        # confidence: high -- Timestamp for when the data was last synced.
  - name: Package
    sql_table: dim_package
    measures:
      - name: package_count
        sql: package_id
        type: count
        # confidence: high -- Count of unique packages.
      - name: average_price
        sql: price
        type: avg
        # confidence: high -- Average price of packages.
    dimensions:
      - name: package_id
        sql: package_id
        type: string
        # confidence: high -- Primary key for package.
      - name: package_name
        sql: package_name
        type: string
        # confidence: medium -- Name of the package, but its business meaning is not clear.
      - name: bandwidth
        sql: bandwidth
        type: string
        # confidence: medium -- Bandwidth associated with the package, but its business meaning is not clear.
      - name: price
        sql: price
        type: number
        # confidence: high -- Price of the package.
      - name: source_synced_at
        sql: source_synced_at
        type: time
        # confidence: high -- Timestamp for when the data was last synced.
  - name: POP
    sql_table: dim_pop
    measures:
    dimensions:
      - name: pop_id
        sql: pop_id
        type: string
        # confidence: high -- Primary key for POP.
      - name: pop_name
        sql: pop_name
        type: string
        # confidence: medium -- Name of the POP, but its business meaning is not clear.
      - name: source_synced_at
        sql: source_synced_at
        type: time
        # confidence: high -- Timestamp for when the data was last synced.
  - name: Region
    sql_table: dim_region
    measures:
    dimensions:
      - name: region_id
        sql: region_id
        type: string
        # confidence: high -- Primary key for region.
      - name: division_name
        sql: division_name
        type: string
        # confidence: medium -- Name of the division, but its business meaning is not clear.
      - name: district_name
        sql: district_name
        type: string
        # confidence: medium -- Name of the district, but its business meaning is not clear.
      - name: city_corporation
        sql: city_corporation
        type: string
        # confidence: medium -- Name of the city corporation, but its business meaning is not clear.
      - name: source_synced_at
        sql: source_synced_at
        type: time
        # confidence: high -- Timestamp for when the data was last synced.
  - name: Status
    sql_table: dim_status
    measures:
    dimensions:
      - name: status_id
        sql: status_id
        type: string
        # confidence: high -- Primary key for status.
      - name: status_name
        sql: status_name
        type: string
        # confidence: medium -- Name of the status, but its business meaning is not clear.
      - name: source_synced_at
        sql: source_synced_at
        type: time
        # confidence: high -- Timestamp for when the data was last synced.
  - name: TicketType
    sql_table: dim_ticket_type
    measures:
    dimensions:
      - name: ticket_type_id
        sql: ticket_type_id
        type: string
        # confidence: high -- Primary key for ticket type.
      - name: ticket_type_name
        sql: ticket_type_name
        type: string
        # confidence: high -- Name of the ticket type.
      - name: source_synced_at
        sql: source_synced_at
        type: time
        # confidence: high -- Timestamp for when the data was last synced.
  - name: ETLSyncLog
    sql_table: etl_sync_log
    measures:
    dimensions:
      - name: source_table
        sql: source_table
        type: string
        # confidence: high -- Primary key for the source table.
      - name: last_synced_at
        sql: last_synced_at
        type: time
        # confidence: medium -- Timestamp for the last sync, but its business meaning is not clear.
      - name: last_run_started_at
        sql: last_run_started_at
        type: time
        # confidence: medium -- Timestamp for when the last run started, but its business meaning is not clear.
      - name: last_run_finished_at
        sql: last_run_finished_at
        type: time
        # confidence: medium -- Timestamp for when the last run finished, but its business meaning is not clear.
      - name: last_run_status
        sql: last_run_status
        type: string
        # confidence: medium -- Status of the last run, but its business meaning is not clear.
      - name: last_run_row_count
        sql: last_run_row_count
        type: number
        # confidence: medium -- Row count from the last run, but its business meaning is not clear.
      - name: last_error
        sql: last_error
        type: string
        # confidence: medium -- Last error message, but its business meaning is not clear.
  - name: Adjustment
    sql_table: fact_adjustment
    measures:
      - name: total_adjustment_amount
