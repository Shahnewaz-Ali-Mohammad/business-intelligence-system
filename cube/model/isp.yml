# Real ISP production warehouse (Postgres `public` schema) -- hand-written,
# not AI-drafted, because this schema is fully known and documented in
# database/warehouse-schema.sql (see that file for the authoritative
# column/business-rule comments this model mirrors).
#
# IMPORTANT: every foreign key on these fact tables was deliberately
# DROPPED after the first real sync (see warehouse-schema.sql's own PATCH
# comment) -- real production rows reference customers/departments/ticket
# types that don't exist in the dimension tables (15+ years of legacy
# data). Every join below is therefore LEFT JOIN on matching column
# values, never an enforced relationship -- a fact row with no matching
# dimension row still returns (with nulls for that dimension's fields),
# it is never silently dropped.
cubes:
  - name: IspCustomer
    sql_table: dim_customer
    joins:
      - name: IspPop
        sql: "{CUBE}.pop_id = {IspPop}.pop_id"
        relationship: many_to_one
      - name: IspStatus
        sql: "{CUBE}.status_id = {IspStatus}.status_id"
        relationship: many_to_one
      - name: IspPackage
        sql: "{CUBE}.package_id = {IspPackage}.package_id"
        relationship: many_to_one
    measures:
      - name: customer_count
        sql: customer_id
        type: count
      - name: active_customer_count
        sql: customer_id
        type: count
        filters:
          - sql: "{CUBE}.status_id = '1'"
    dimensions:
      - name: customer_id
        sql: customer_id
        type: string
        primary_key: true
        public: true
      - name: customer_name
        sql: customer_name
        type: string
      - name: pop_id
        sql: pop_id
        type: string
      - name: package_id
        sql: package_id
        type: string
      - name: status_id
        sql: status_id
        type: string
      - name: connection_type
        sql: connection_type
        type: string
      - name: resident_type
        sql: resident_type
        type: string
      - name: entry_date
        sql: entry_date
        type: time
      - name: activated_date
        sql: activated_date
        type: time
      - name: source_synced_at
        sql: source_synced_at
        type: time

  - name: IspPop
    sql_table: dim_pop
    measures:
      - name: pop_count
        sql: pop_id
        type: count
    dimensions:
      - name: pop_id
        sql: pop_id
        type: string
        primary_key: true
        public: true
      - name: pop_name
        sql: pop_name
        type: string
      - name: source_synced_at
        sql: source_synced_at
        type: time

  - name: IspPackage
    sql_table: dim_package
    measures:
      - name: package_count
        sql: package_id
        type: count
      - name: avg_price
        sql: price
        type: avg
    dimensions:
      - name: package_id
        sql: package_id
        type: string
        primary_key: true
        public: true
      - name: package_name
        sql: package_name
        type: string
      - name: bandwidth
        sql: bandwidth
        type: string
      - name: price
        sql: price
        type: number
      - name: source_synced_at
        sql: source_synced_at
        type: time

  - name: IspStatus
    sql_table: dim_status
    measures:
      - name: status_count
        sql: status_id
        type: count
    dimensions:
      - name: status_id
        sql: status_id
        type: string
        primary_key: true
        public: true
      - name: status_name
        sql: status_name
        type: string
      - name: source_synced_at
        sql: source_synced_at
        type: time

  - name: IspDepartment
    sql_table: dim_department
    measures:
      - name: department_count
        sql: department_id
        type: count
    dimensions:
      - name: department_id
        sql: department_id
        type: string
        primary_key: true
        public: true
      - name: department_name
        sql: department_name
        type: string
      - name: source_synced_at
        sql: source_synced_at
        type: time

  - name: IspTicketType
    sql_table: dim_ticket_type
    measures:
      - name: ticket_type_count
        sql: ticket_type_id
        type: count
    dimensions:
      - name: ticket_type_id
        sql: ticket_type_id
        type: string
        primary_key: true
        public: true
      - name: ticket_type_name
        sql: ticket_type_name
        type: string
      - name: source_synced_at
        sql: source_synced_at
        type: time

  # Billing: real charges (accrual). RefTypeID 1,2,3,7,8,10 -- see
  # warehouse-schema.sql header for the full confirmed RefTypeID mapping.
  - name: IspBilling
    sql_table: fact_billing
    joins:
      - name: IspCustomer
        sql: "{CUBE}.customer_id = {IspCustomer}.customer_id"
        relationship: many_to_one
      - name: IspPop
        sql: "{CUBE}.pop_id = {IspPop}.pop_id"
        relationship: many_to_one
      - name: IspPackage
        sql: "{CUBE}.package_id = {IspPackage}.package_id"
        relationship: many_to_one
    measures:
      - name: total_billed
        sql: amount
        type: sum
      - name: billing_count
        sql: billing_sk
        type: count
      - name: avg_transaction_amount
        sql: amount
        type: avg
      - name: min_transaction_amount
        sql: amount
        type: min
      - name: max_transaction_amount
        sql: amount
        type: max
    dimensions:
      - name: billing_sk
        sql: billing_sk
        type: number
        primary_key: true
        public: true
      - name: source_snid
        sql: source_snid
        type: string
      - name: amount
        sql: amount
        type: number
      - name: tran_id
        sql: tran_id
        type: string
      - name: ref_type_id
        sql: ref_type_id
        type: number
      - name: source_synced_at
        sql: source_synced_at
        type: time
      - name: ref_date
        sql: ref_date
        type: time
      - name: ref_type_name
        sql: ref_type_name
        type: string
      - name: customer_id
        sql: customer_id
        type: string
      - name: pop_id
        sql: pop_id
        type: string
      - name: package_id
        sql: package_id
        type: string

  # Collection: real cash received. RefTypeID 4 (MR / Money Receipt).
  - name: IspCollection
    sql_table: fact_collection
    joins:
      - name: IspCustomer
        sql: "{CUBE}.customer_id = {IspCustomer}.customer_id"
        relationship: many_to_one
      - name: IspPop
        sql: "{CUBE}.pop_id = {IspPop}.pop_id"
        relationship: many_to_one
      - name: IspPackage
        sql: "{CUBE}.package_id = {IspPackage}.package_id"
        relationship: many_to_one
    measures:
      - name: total_collected
        sql: amount
        type: sum
      - name: collection_count
        sql: collection_sk
        type: count
      - name: avg_transaction_amount
        sql: amount
        type: avg
      - name: min_transaction_amount
        sql: amount
        type: min
      - name: max_transaction_amount
        sql: amount
        type: max
    dimensions:
      - name: collection_sk
        sql: collection_sk
        type: number
        primary_key: true
        public: true
      - name: source_snid
        sql: source_snid
        type: string
      - name: amount
        sql: amount
        type: number
      - name: tran_id
        sql: tran_id
        type: string
      - name: ref_date
        sql: ref_date
        type: time
      - name: customer_id
        sql: customer_id
        type: string
      - name: pop_id
        sql: pop_id
        type: string
      - name: package_id
        sql: package_id
        type: string
      - name: tran_mode_id
        # NOTE: raw payment-channel code -- TranModeMaster is a real,
        # confirmed-readable source table but is not yet synced into this
        # warehouse to resolve this to a human name (cash/bKash/Nagad).
        # Report this as "Mode <id>", never invent what it means.
        sql: tran_mode_id
        type: string
      - name: tran_mode_name
        sql: tran_mode_name
        type: string
      - name: source_synced_at
        sql: source_synced_at
        type: time

  # Refund: RefTypeID 5. Recorded as Debit in source -- NOT a negative
  # collection, kept as its own fact (see warehouse-schema.sql).
  - name: IspRefund
    sql_table: fact_refund
    joins:
      - name: IspCustomer
        sql: "{CUBE}.customer_id = {IspCustomer}.customer_id"
        relationship: many_to_one
    measures:
      - name: total_refunded
        sql: amount
        type: sum
      - name: refund_count
        sql: refund_sk
        type: count
      - name: avg_transaction_amount
        sql: amount
        type: avg
      - name: min_transaction_amount
        sql: amount
        type: min
      - name: max_transaction_amount
        sql: amount
        type: max
    dimensions:
      - name: refund_sk
        sql: refund_sk
        type: number
        primary_key: true
        public: true
      - name: source_synced_at
        sql: source_synced_at
        type: time
      - name: source_snid
        sql: source_snid
        type: string
      - name: amount
        sql: amount
        type: number
      - name: ref_date
        sql: ref_date
        type: time
      - name: customer_id
        sql: customer_id
        type: string

  # Adjustment: RefTypeID 6, recorded as Credit.
  - name: IspAdjustment
    sql_table: fact_adjustment
    joins:
      - name: IspCustomer
        sql: "{CUBE}.customer_id = {IspCustomer}.customer_id"
        relationship: many_to_one
    measures:
